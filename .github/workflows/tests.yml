# Run pytest on every push to main and every PR.
#
# Data-dependent tests (those that need smard_merged_15min.parquet or a
# trained Keras checkpoint) auto-skip via pytestmark guards. The leakage
# tests, dispatch-math tests, schema tests, and unit tests all run.
#
# Caches pip downloads so subsequent runs install in ~30 s instead of 2 min.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q
